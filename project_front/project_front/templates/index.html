<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>贷款分类预测</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="heading">
          <p class="eyebrow">Local Spark GBT Model</p>
          <h1>贷款分类预测</h1>
          <p class="model-path">{{ model_path }}</p>
        </div>

        <form id="predict-form" class="form-grid">
          <label>
            贷款用途
            <select name="purpose" required>
              {% for item in purpose_options %}
              <option value="{{ item }}">{{ item }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            州
            <select name="addr_state" required>
              {% for item in state_options %}
              <option value="{{ item }}">{{ item }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            贷款金额
            <input name="loan_amnt" type="number" min="0" step="100" value="10000" required>
          </label>

          <label>
            工作年限
            <input name="emp_length" type="number" min="0" max="10" step="1" value="5" required>
          </label>

          <label>
            DTI
            <input name="dti" type="number" min="0" step="0.01" value="18.5" required>
          </label>

          <label>
            邮编
            <input name="zip_code" type="text" placeholder="e.g., 94301" required>
          </label>

          <div style="grid-column: 1 / -1; display: flex; gap: 10px;">
            <button type="submit" id="predict-btn">开始分类</button>
            <button type="button" id="aggregated-btn">查看聚合数据</button>
          </div>
        </form>
      </section>

      <aside class="result-panel">
        <div class="result-card">
          <p class="eyebrow">Prediction</p>
          <h2 id="result-label">等待输入</h2>
          <p id="result-summary">提交表单后会显示模型分类结果。</p>
          <div class="meter">
            <span id="negative-bar"></span>
            <span id="positive-bar"></span>
          </div>
          <dl>
            <div>
              <dt>负类概率</dt>
              <dd id="negative-prob">-</dd>
            </div>
            <div>
              <dt>正类概率</dt>
              <dd id="positive-prob">-</dd>
            </div>
          </dl>
        </div>

        <div class="result-card" id="aggregated-card" style="display:none; margin-top: 16px;">
          <p class="eyebrow">聚合统计</p>
          <h2 id="aggregated-label">数据统计</h2>
          <dl>
            <div>
              <dt>州通过率</dt>
              <dd id="state-approval-rate">-</dd>
            </div>
            <div>
              <dt>州平均 DTI</dt>
              <dd id="state-avg-dti">-</dd>
            </div>
            <div>
              <dt>用途通过率</dt>
              <dd id="purpose-approval-rate">-</dd>
            </div>
            <div>
              <dt>用途平均贷款额</dt>
              <dd id="purpose-avg-loan-amnt">-</dd>
            </div>
            <div>
              <dt>邮编通过率</dt>
              <dd id="zip-approval-rate">-</dd>
            </div>
          </dl>
        </div>
      </aside>
    </main>

    <script>
      const form = document.querySelector("#predict-form");
      const predictBtn = document.querySelector("#predict-btn");
      const aggregatedBtn = document.querySelector("#aggregated-btn");
      const resultLabel = document.querySelector("#result-label");
      const resultSummary = document.querySelector("#result-summary");
      const negativeProb = document.querySelector("#negative-prob");
      const positiveProb = document.querySelector("#positive-prob");
      const negativeBar = document.querySelector("#negative-bar");
      const positiveBar = document.querySelector("#positive-bar");
      const aggregatedCard = document.querySelector("#aggregated-card");
      const stateApprovalRate = document.querySelector("#state-approval-rate");
      const stateAvgDti = document.querySelector("#state-avg-dti");
      const purposeApprovalRate = document.querySelector("#purpose-approval-rate");
      const purposeAvgLoanAmnt = document.querySelector("#purpose-avg-loan-amnt");
      const zipApprovalRate = document.querySelector("#zip-approval-rate");

      function setLoading(isLoading, btn) {
        btn.disabled = isLoading;
        btn.textContent = isLoading ? (btn === predictBtn ? "分类中..." : "加载中...") : (btn === predictBtn ? "开始分类" : "查看聚合数据");
      }

      function percent(value) {
        return `${(value * 100).toFixed(2)}%`;
      }

      function formatNumber(value, decimals = 2) {
        return typeof value === "number" ? value.toFixed(decimals) : "-";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setLoading(true, predictBtn);
        resultLabel.textContent = "分类中";
        resultSummary.textContent = "正在调用本地 Spark 模型。";
        aggregatedCard.style.display = "none";

        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        try {
          const response = await fetch("/api/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "预测失败");
          }

          const p0 = data.probability[0] || 0;
          const p1 = data.probability[1] || 0;
          resultLabel.textContent = data.label;
          resultSummary.textContent = `模型输出分类：${data.prediction}`;
          negativeProb.textContent = percent(p0);
          positiveProb.textContent = percent(p1);
          negativeBar.style.width = percent(p0);
          positiveBar.style.width = percent(p1);
        } catch (error) {
          resultLabel.textContent = "预测失败";
          resultSummary.textContent = error.message;
          negativeProb.textContent = "-";
          positiveProb.textContent = "-";
          negativeBar.style.width = "0%";
          positiveBar.style.width = "0%";
        } finally {
          setLoading(false, predictBtn);
        }
      });

      aggregatedBtn.addEventListener("click", async (event) => {
        event.preventDefault();
        setLoading(true, aggregatedBtn);
        aggregatedCard.style.display = "none";

        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        try {
          const response = await fetch("/api/aggregated_stats", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "获取聚合数据失败");
          }

          stateApprovalRate.textContent = percent(data.state_approval_rate);
          stateAvgDti.textContent = formatNumber(data.state_avg_dti);
          purposeApprovalRate.textContent = percent(data.purpose_approval_rate);
          purposeAvgLoanAmnt.textContent = formatNumber(data.purpose_avg_loan_amnt);
          zipApprovalRate.textContent = percent(data.zip_approval_rate);

          aggregatedCard.style.display = "block";
        } catch (error) {
          alert("错误：" + error.message);
        } finally {
          setLoading(false, aggregatedBtn);
        }
      });
    </script>
  </body>
</html>
