<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>贷款分类预测</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="heading">
          <p class="eyebrow">Local Spark GBT Model</p>
          <h1>贷款分类预测</h1>
          <p class="model-path">{{ model_path }}</p>
        </div>

        <form id="predict-form" class="form-grid">
          <label>
            贷款用途
            <select name="purpose" required>
              {% for item in purpose_options %}
              <option value="{{ item }}">{{ item }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            州
            <select name="addr_state" required>
              {% for item in state_options %}
              <option value="{{ item }}">{{ item }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            邮编前 3 位
            <input name="zip_code" type="text" inputmode="numeric" maxlength="3" minlength="3" pattern="[0-9]{3}" value="941" required>
          </label>

          <label>
            贷款金额
            <input name="loan_amnt" type="number" min="0" step="100" value="10000" required>
          </label>

          <label>
            工作年限
            <input name="emp_length" type="number" min="0" max="10" step="1" value="5" required>
          </label>

          <label>
            DTI
            <input name="dti" type="number" min="0" step="0.01" value="18.5" required>
          </label>

          <input type="hidden" name="state_approval_rate">
          <input type="hidden" name="state_avg_dti">
          <input type="hidden" name="purpose_approval_rate">
          <input type="hidden" name="purpose_avg_loan_amnt">
          <input type="hidden" name="zip_approval_rate">
          <input type="hidden" name="retrieved_aggregate_metrics" value="false">

          <div class="actions">
            <button type="button" id="lookup-button" class="secondary">获取聚合特征</button>
            <button type="submit">开始分类</button>
          </div>
        </form>
      </section>

      <aside class="result-panel">
        <div class="result-card">
          <p class="eyebrow">DWS Lookup</p>
          <h2 id="lookup-label">等待查询</h2>
          <p id="lookup-summary">点击“获取聚合特征”后，会从 AnalyticDB 的 dws_geo_lookup、dws_purpose_lookup 和 dws_zip_lookup 读取聚合指标并自动回填表单。</p>
          <dl class="lookup-metrics">
            <div>
              <dt>州通过率</dt>
              <dd id="state-approval-rate">-</dd>
            </div>
            <div>
              <dt>州平均 DTI</dt>
              <dd id="state-avg-dti">-</dd>
            </div>
            <div>
              <dt>用途通过率</dt>
              <dd id="purpose-approval-rate">-</dd>
            </div>
            <div>
              <dt>用途平均贷款额</dt>
              <dd id="purpose-avg-loan-amnt">-</dd>
            </div>
            <div>
              <dt>邮编通过率</dt>
              <dd id="zip-approval-rate">-</dd>
            </div>
          </dl>

          <div class="result-separator"></div>

          <p class="eyebrow">Prediction</p>
          <h2 id="result-label">等待输入</h2>
          <p id="result-summary">提交表单后会显示模型分类结果。</p>
          <div class="meter">
            <span id="negative-bar"></span>
            <span id="positive-bar"></span>
          </div>
          <dl>
            <div>
              <dt>负类概率</dt>
              <dd id="negative-prob">-</dd>
            </div>
            <div>
              <dt>正类概率</dt>
              <dd id="positive-prob">-</dd>
            </div>
          </dl>
        </div>
      </aside>
    </main>

    <script>
      const form = document.querySelector("#predict-form");
      const lookupButton = document.querySelector("#lookup-button");
      const lookupLabel = document.querySelector("#lookup-label");
      const lookupSummary = document.querySelector("#lookup-summary");
      const stateApprovalRate = document.querySelector("#state-approval-rate");
      const stateAvgDti = document.querySelector("#state-avg-dti");
      const purposeApprovalRate = document.querySelector("#purpose-approval-rate");
      const purposeAvgLoanAmnt = document.querySelector("#purpose-avg-loan-amnt");
      const zipApprovalRate = document.querySelector("#zip-approval-rate");
      const resultLabel = document.querySelector("#result-label");
      const resultSummary = document.querySelector("#result-summary");
      const negativeProb = document.querySelector("#negative-prob");
      const positiveProb = document.querySelector("#positive-prob");
      const negativeBar = document.querySelector("#negative-bar");
      const positiveBar = document.querySelector("#positive-bar");
      const retrievedAggregateMetricsField = form.elements.retrieved_aggregate_metrics;
      let retrieved_aggregate_metrics = false;

      function setRetrievedAggregateMetrics(value) {
        retrieved_aggregate_metrics = value;
        retrievedAggregateMetricsField.value = value ? "true" : "false";
      }

      function resetRetrievedAggregateMetrics() {
        setRetrievedAggregateMetrics(false);
      }

      function setLoading(button, isLoading, loadingText, defaultText) {
        button.disabled = isLoading;
        button.textContent = isLoading ? loadingText : defaultText;
      }

      function percent(value) {
        return `${(value * 100).toFixed(2)}%`;
      }

      function formatMetric(value, isPercent = false) {
        if (value === null || value === undefined) {
          return "-";
        }
        if (isPercent) {
          return percent(value);
        }
        return Number(value).toLocaleString(undefined, {
          maximumFractionDigits: 2,
        });
      }

      function applyLookupMetrics(data) {
        const metrics = data.metrics || {};
        const input = data.input || {};

        form.elements.state_approval_rate.value = metrics.state_approval_rate;
        form.elements.state_avg_dti.value = metrics.state_avg_dti;
        form.elements.purpose_approval_rate.value = metrics.purpose_approval_rate;
        form.elements.purpose_avg_loan_amnt.value = metrics.purpose_avg_loan_amnt;
        form.elements.zip_approval_rate.value = metrics.zip_approval_rate;

        stateApprovalRate.textContent = formatMetric(metrics.state_approval_rate, true);
        stateAvgDti.textContent = formatMetric(metrics.state_avg_dti);
        purposeApprovalRate.textContent = formatMetric(metrics.purpose_approval_rate, true);
        purposeAvgLoanAmnt.textContent = formatMetric(metrics.purpose_avg_loan_amnt);
        zipApprovalRate.textContent = formatMetric(metrics.zip_approval_rate, true);

        setRetrievedAggregateMetrics(true);
        lookupLabel.textContent = "查询完成";
        lookupSummary.textContent = `已使用州 ${input.addr_state}、用途 ${input.purpose} 和邮编前缀 ${input.zip_code} 回填聚合特征。`;
      }

      lookupButton.addEventListener("click", async () => {
        setLoading(lookupButton, true, "查询中...", "获取聚合特征");
        lookupLabel.textContent = "查询中";
        lookupSummary.textContent = "正在从 AnalyticDB 读取 DWS 聚合指标。";

        const payload = Object.fromEntries(new FormData(form).entries());

        try {
          const response = await fetch("/api/lookup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "聚合特征获取失败");
          }

          applyLookupMetrics(data);
        } catch (error) {
          lookupLabel.textContent = "查询失败";
          lookupSummary.textContent = error.message;
        } finally {
          setLoading(lookupButton, false, "查询中...", "获取聚合特征");
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submitButton = form.querySelector("button[type='submit']");

        if (!retrieved_aggregate_metrics) {
          resultLabel.textContent = "预测失败";
          resultSummary.textContent = "请先点击“获取聚合特征”并成功获取结果，再进行预测。";
          return;
        }

        setLoading(submitButton, true, "分类中...", "开始分类");
        resultLabel.textContent = "分类中";
        resultSummary.textContent = "正在调用本地 Spark 模型。";

        const payload = Object.fromEntries(new FormData(form).entries());

        try {
          const response = await fetch("/api/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "预测失败");
          }

          const p0 = data.probability[0] || 0;
          const p1 = data.probability[1] || 0;
          resultLabel.textContent = data.label;
          resultSummary.textContent = `模型输出分类：${data.prediction}`;
          negativeProb.textContent = percent(p0);
          positiveProb.textContent = percent(p1);
          negativeBar.style.width = percent(p0);
          positiveBar.style.width = percent(p1);
        } catch (error) {
          resultLabel.textContent = "预测失败";
          resultSummary.textContent = error.message;
          negativeProb.textContent = "-";
          positiveProb.textContent = "-";
          negativeBar.style.width = "0%";
          positiveBar.style.width = "0%";
        } finally {
          resetRetrievedAggregateMetrics();
          setLoading(submitButton, false, "分类中...", "开始分类");
        }
      });
    </script>
  </body>
</html>
